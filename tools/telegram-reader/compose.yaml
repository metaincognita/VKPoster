name: vkposter-telegram-reader-spike
services:
  reader:
    build: .
    init: true
    command: [sources]
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    volumes:
      - reader-state:/state
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
volumes:
  reader-state:
